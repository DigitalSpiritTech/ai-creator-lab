# Fly.io configuration for the read-only demo. `fly launch --copy-config` from the repo folder,
# then set STUDIO_PUBLIC_HOST to the hostname you will serve it on (see docs/DEMO-DEPLOY.md).
app = "ai-creator-lab-demo"
primary_region = "dfw"

[build]

[env]
  STUDIO_READ_ONLY = "1"
  STUDIO_PUBLIC_HOST = "ai-creator-lab-demo.fly.dev"
  STUDIO_DATA_DIR = "/data"
  STUDIO_RECOVERY = "off"
  PORT = "3000"

[[mounts]]
  source = "demo_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
