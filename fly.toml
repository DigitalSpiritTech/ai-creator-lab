# fly.toml app configuration file generated for ai-creator-lab-demo on 2026-10-30T08:55:03-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ai-creator-lab-demo'
primary_region = 'dfw'

[build]
[env]
  PORT = '3000'
  STUDIO_DATA_DIR = '/data'
  STUDIO_PUBLIC_HOST = 'ai-creator-lab-demo.fly.dev'
  STUDIO_READ_ONLY = '1'
  STUDIO_RECOVERY = 'off'

[[mounts]]
  source = 'demo_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 50
    soft_limit = 25

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
