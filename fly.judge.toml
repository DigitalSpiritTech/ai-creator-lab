# Fly.io configuration for the password-protected judging copy. Deploy with
# `fly deploy --config fly.judge.toml`; the secrets (password, keys, allowance) are set with
# `fly secrets set`, never written here. See docs/DEMO-DEPLOY.md.
app = "ai-creator-lab-judging"
primary_region = "dfw"

[build]

[env]
  STUDIO_PUBLIC_HOST = "ai-creator-lab-judging.fly.dev"
  STUDIO_DATA_DIR = "/data"
  PORT = "3000"

[[mounts]]
  source = "judge_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 20
    soft_limit = 10

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
