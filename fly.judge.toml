# fly.toml app configuration file generated for ai-creator-lab-judging on 2026-10-30T10:36:09-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ai-creator-lab-judging'
primary_region = 'dfw'

[build]
[env]
  PORT = '3000'
  STUDIO_DATA_DIR = '/data'
  STUDIO_PUBLIC_HOST = 'ai-creator-lab-judging.fly.dev'

[[mounts]]
  source = 'judge_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 20
    soft_limit = 10

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
